services:
  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: gplx-backend
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gplx
      SPRING_DATASOURCE_USERNAME: gplx
      SPRING_DATASOURCE_PASSWORD: gplx
      APP_CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: gplx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gplx
      POSTGRES_USER: gplx
      POSTGRES_PASSWORD: gplx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gplx -d gplx"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  maven_cache:
