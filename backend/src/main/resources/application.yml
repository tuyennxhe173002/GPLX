spring:
  application:
    name: gplx
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gplx}
    username: ${SPRING_DATASOURCE_USERNAME:gplx}
    password: ${SPRING_DATASOURCE_PASSWORD:gplx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:U29tZVN1cGVyU2VjcmV0S2V5Rm9yR1BMWFN1cGVyU2VjcmV0S2V5MTIzNDU2Nzg=}
    access-token-expiration-seconds: ${APP_AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${APP_AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    location: ${APP_SEED_LOCATION:data}
    validation-mode: ${APP_SEED_VALIDATION_MODE:PARTIAL}
