spring:
  application:
    name: gplx
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/gplx}
    username: ${SPRING_DATASOURCE_USERNAME:gplx}
    password: ${SPRING_DATASOURCE_PASSWORD:gplx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:*}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:U29tZVN1cGVyU2VjcmV0S2V5Rm9yR1BMWFN1cGVyU2VjcmV0S2V5MTIzNDU2Nzg=}
    access-token-expiration-seconds: ${APP_AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${APP_AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@gplx.vn}
    initial-password: ${APP_ADMIN_INITIAL_PASSWORD:Admin@123456}
    full-name: ${APP_ADMIN_FULL_NAME:Quản Trị Viên}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    location: ${APP_SEED_LOCATION:data}
    validation-mode: ${APP_SEED_VALIDATION_MODE:PARTIAL}
