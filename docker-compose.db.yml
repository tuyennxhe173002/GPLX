services:
  postgres:
    image: postgres:16-alpine
    container_name: gplx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gplx}
      POSTGRES_USER: ${POSTGRES_USER:-gplx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gplx}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gplx} -d ${POSTGRES_DB:-gplx}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
