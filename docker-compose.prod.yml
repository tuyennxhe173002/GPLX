services:
  postgres:
    image: postgres:16-alpine
    container_name: gplx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gplx}
      POSTGRES_USER: ${POSTGRES_USER:-gplx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gplx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gplx} -d ${POSTGRES_DB:-gplx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    container_name: gplx-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gplx}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gplx}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gplx}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET}
      APP_AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS: ${APP_AUTH_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      APP_AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS: ${APP_AUTH_REFRESH_TOKEN_EXPIRATION_SECONDS:-2592000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_LOCATION: ${APP_SEED_LOCATION:-data}
      APP_SEED_VALIDATION_MODE: ${APP_SEED_VALIDATION_MODE:-FULL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: gplx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
